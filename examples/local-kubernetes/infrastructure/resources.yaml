# resources.yaml - Explicit prerequisites for a disposable local cluster.

apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Namespace
  metadata:
    name: deployops-local
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: web-development
    namespace: deployops-local
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: web-development
    template:
      metadata:
        labels:
          app: web-development
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
        containers:
        - name: web
          image: python@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
          command:
          - sh
          - -c
          - mkdir -p /tmp/site && echo 'DeployOps local Kubernetes' > /tmp/site/index.html
            && exec python -m http.server 8080 --bind 0.0.0.0 --directory /tmp/site
          ports:
          - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
          volumeMounts:
          - name: scratch
            mountPath: /tmp
        volumes:
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
- apiVersion: v1
  kind: Service
  metadata:
    name: web-development
    namespace: deployops-local
  spec:
    selector:
      app: web-development
    ports:
    - port: 8080
      targetPort: 8080
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: web-staging
    namespace: deployops-local
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: web-staging
    template:
      metadata:
        labels:
          app: web-staging
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
        containers:
        - name: web
          image: python@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
          command:
          - sh
          - -c
          - mkdir -p /tmp/site && echo 'DeployOps local Kubernetes' > /tmp/site/index.html
            && exec python -m http.server 8080 --bind 0.0.0.0 --directory /tmp/site
          ports:
          - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
          volumeMounts:
          - name: scratch
            mountPath: /tmp
        volumes:
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
- apiVersion: v1
  kind: Service
  metadata:
    name: web-staging
    namespace: deployops-local
  spec:
    selector:
      app: web-staging
    ports:
    - port: 8080
      targetPort: 8080
