# resources.yaml - Explicit prerequisites for a disposable local cluster.


# Apply this reviewed list only to the disposable local cluster
apiVersion: v1
kind: List
items:

# Isolate the example from other cluster workloads
- apiVersion: v1
  kind: Namespace
  metadata:
    name: deployops-local

# Keep development and staging workloads independently addressable
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: web-development
    namespace: deployops-local
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: web-development
    template:
      metadata:
        labels:
          app: web-development
      spec:

        # Run the pod as an unprivileged user with a writable scratch group
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
        containers:
        - name: web
          image: python@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8

          # Serve disposable content from the bounded memory-backed volume
          command:
          - sh
          - -c
          - mkdir -p /tmp/site && echo 'DeployOps local Kubernetes' > /tmp/site/index.html
            && exec python -m http.server 8080 --bind 0.0.0.0 --directory /tmp/site
          ports:
          - containerPort: 8080

          # Bound scheduler requests and maximum workload consumption
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi

          # Keep the image read-only and drop additional process privileges
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL

          # Admit traffic only after the HTTP server responds
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2

          # Mount only the pod-owned scratch volume
          volumeMounts:
          - name: scratch
            mountPath: /tmp
        volumes:
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi

# Route namespace-local traffic to the matching environment deployment
- apiVersion: v1
  kind: Service
  metadata:
    name: web-development
    namespace: deployops-local
  spec:
    selector:
      app: web-development
    ports:
    - port: 8080
      targetPort: 8080

# Keep development and staging workloads independently addressable
- apiVersion: apps/v1
