# integrations/github/delivery-worker.yml - Deliver prebuilt images from a protected reusable workflow.
# Install as .github/workflows/delivery.yml after reviewing the workspace and replacing the source pins.
# This recipe has not run on GitHub. Its cloud CLIs and trust configuration need live qualification.

name: DeployOps application delivery
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image:
        type: string
        required: true
      receipts:
        type: string
        default: "{}"
      caller_label:
        type: string
        default: ""
      # Preserve older callers while new workflows use neutral labels
      agent_label:
        type: string
        default: ""
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-ops-app-${{ github.repository_id }}-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deliver:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_OPS_URL: ${{ vars.DEPLOY_OPS_URL }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_IMAGE: ${{ inputs.image }}
      DEPLOY_RECEIPTS: ${{ inputs.receipts }}
      CALLER_LABEL: ${{ inputs.caller_label || inputs.agent_label }}
    steps:
      # The caller's source is snapshotted, not executed in this credential-bearing job
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: workspace/application
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: neon1llc/deploy-ops
          ref: TOOLKIT_COMMIT_SHA
          path: toolkit
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: neon1llc/deploy-ops@TOOLKIT_COMMIT_SHA
      - name: Load the operator-owned workspace
        run: |
          set -euo pipefail
          case "$DEPLOY_ENVIRONMENT" in
            development) cp toolkit/examples/aws-receipts/deploy-ops.toml workspace/deploy-ops.toml ;;
            gcp-development) cp toolkit/examples/gcp-receipts/deploy-ops.toml workspace/deploy-ops.toml ;;
            *) cp toolkit/examples/cloud-app/deploy-ops.toml workspace/deploy-ops.toml ;;
          esac
          # Do not download and execute arbitrary installers in the writer job
          case "$DEPLOY_ENVIRONMENT" in
            development|aws-development) command -v aws ;;
            azure-staging) command -v az ;;
            gcp-development|gcp-production) command -v gcloud ;;
            *) echo "Unsupported registered environment" >&2; exit 2 ;;
          esac
      - name: Prepare, await approval, and deliver
        id: delivery
        run: |
          set -uo pipefail
          # Keep the exact deployment exit, including waiting=3; evidence capture runs separately
          set +e
          deploy-ops --project workspace/deploy-ops.toml run "$DEPLOY_ENVIRONMENT" \
            --component web --only --image "$DEPLOY_IMAGE" --receipts "$DEPLOY_RECEIPTS" \
            --caller-label "$CALLER_LABEL" --wait-seconds 1800 > delivery-result.json
          outcome=$?
          cat delivery-result.json
          exit "$outcome"
      # Capture one returned release; pre-execution absence fails capture rather than inventing an outcome
      - name: Capture portable inspection
        id: inspection_capture
        if: always()
        run: |
          set -euo pipefail
          release=$(python -c 'import json; print(json.load(open("delivery-result.json"))["id"])')
          deploy-ops --project workspace/deploy-ops.toml evidence capture "$release" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --out inspection.json
      # This new artifact contains only the validated projection, under the same private job recipients
      - name: Upload portable inspection
        id: inspection_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: inspection.json
          if-no-files-found: error
          retention-days: 1
      # Record returned transport identity independently of deployment and capture outcomes
      - name: Record inspection transport
        if: always()
        env:
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
          CAPTURE_OUTCOME: ${{ steps.inspection_capture.outcome }}
          UPLOAD_OUTCOME: ${{ steps.inspection_upload.outcome }}
          ARTIFACT_ID: ${{ steps.inspection_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.inspection_upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.inspection_upload.outputs.artifact-url }}
        run: |
          # An absent identity is unavailable, never a successful deployment or durable retention promise
          python - <<'PY'
          import json, os
          keys = ("DELIVERY_OUTCOME", "CAPTURE_OUTCOME", "UPLOAD_OUTCOME", "ARTIFACT_ID", "ARTIFACT_DIGEST", "ARTIFACT_URL")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\nInspection transport\n```json\n" + json.dumps({key.lower(): os.environ.get(key) or None for key in keys}, indent=2) + "\n```\n")
          PY
      # Use an allowlist. Interrupted stages may leave cloud login caches in their private home
      # Retain evidence for reconciliation, not source, credentials, or an automatically replayable deployment
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workspace/.deploy-ops/state.db
            workspace/.deploy-ops/state.db-wal
            workspace/.deploy-ops/releases/**/prepared.json
          include-hidden-files: true
          retention-days: 1
