# .github/workflows/check.yml - Run local checks without deployment credentials.


# Check source changes without installing deployment triggers
name: Check
on:
  push:
  pull_request:

# Repository reads are sufficient for this local qualification job
permissions:
  contents: read

# Exercise both supported Python versions on Linux and macOS with the same checks
# Windows is unsupported and untested, so it is not in the matrix
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      # Pin checkout and keep Git credentials out of the working tree
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Select the matrix runtime before installing the pinned check dependencies
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -e .

      # Check source contracts before exercising the complete local delivery journey
      - run: python scripts/check.py
      - run: python -m pytest
      - run: python -m deploy_ops demo "$RUNNER_TEMP/deploy-ops-demo"

  # Install the built wheel with pipx, as the README describes, and run the demo from it
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      # Build the wheel, then install it where only the installed copy can run
      - run: python -m pip install build pipx
      - run: python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - run: |
          export PIPX_HOME="$RUNNER_TEMP/pipx" PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          python -m pipx install "$RUNNER_TEMP"/dist/*.whl
          export PATH="$PIPX_BIN_DIR:$PATH"
          deploy-ops --help > /dev/null
          deploy-ops demo "$RUNNER_TEMP/deploy-ops-installed-demo"
