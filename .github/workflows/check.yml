# .github/workflows/check.yml - Run local checks without deployment credentials.


# Check source changes without installing deployment triggers
name: Check
on:
  push:
  pull_request:

# Repository reads are sufficient for this local qualification job
permissions:
  contents: read

# Exercise both supported Python versions with the same checks
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      # Pin checkout and keep Git credentials out of the working tree
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Select the matrix runtime before installing the pinned check dependencies
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -e .

      # Check source contracts before exercising the complete local delivery journey
      - run: python scripts/check.py
      - run: python -m pytest
      - run: python -m deploy_ops demo "$RUNNER_TEMP/deploy-ops-demo"
