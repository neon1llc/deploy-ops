# .github/workflows/check.yml - Run local checks without deployment credentials.


# Check source changes without installing deployment triggers
name: Check
on:
  push:
  pull_request:

# Repository reads are sufficient for this local qualification job
permissions:
  contents: read

# Exercise both supported Python versions on Linux and macOS with the same checks
# Windows is unsupported and untested, so it is not in the matrix
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      # Pin checkout and keep Git credentials out of the working tree
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Select the matrix runtime before installing the pinned check dependencies
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: python -m pip install -r requirements-dev.txt -e .

      # Check source contracts before exercising the complete local delivery journey
      - run: python scripts/check.py

      # Linux tests must pass. On macOS a few timing-dependent tests still fail on the slower runners,
      # so a failure there is reported without failing the job (see docs/support-matrix.md)
      - name: Run tests
        run: python -m pytest
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
      - run: python -m deploy_ops demo "$RUNNER_TEMP/deploy-ops-demo"

  # Install the built wheel with pipx, as the README describes, and run the demo from it
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # Build the wheel, then install it where only the installed copy can run
      - run: python -m pip install build==1.3.0 pipx==1.8.0
      - run: python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - run: |
          export PIPX_HOME="$RUNNER_TEMP/pipx" PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          python -m pipx install "$RUNNER_TEMP"/dist/*.whl
          export PATH="$PIPX_BIN_DIR:$PATH"
          deploy-ops --help > /dev/null
          deploy-ops demo "$RUNNER_TEMP/deploy-ops-installed-demo"

      # Also install the current checkout so CI checks the source install path, not only wheel contents
      - run: |
          export PIPX_HOME="$RUNNER_TEMP/pipx-source" PIPX_BIN_DIR="$RUNNER_TEMP/pipx-source-bin"
          python -m pipx install .
          export PATH="$PIPX_BIN_DIR:$PATH"
          deploy-ops --help > /dev/null
          deploy-ops demo "$RUNNER_TEMP/deploy-ops-source-demo"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Scan repository history with a fixed, read-only scanner image
      - name: Scan for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb git --redact --exit-code 1 /repo

      # Audit the complete pinned runtime and development dependency set
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-dev.txt
